[workspace]
members = ["crates/*"]
# The engine's checkout (`cargo xtask engine`) is a workspace of its own.
exclude = ["shuyi-engine"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
publish = false
license-file = "LICENSE"
repository = "https://github.com/Zafnok/visions-of-shuyi"

[workspace.dependencies]
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# `ron` and `thiserror` without `std` for the Playdate build (ADR-0070 §3);
# a crate that needs their `std` turns it on (`trpg-content`'s `std`).
ron = { version = "0.12", default-features = false }
include_dir = "0.7"
thiserror = { version = "2", default-features = false }
once_cell = { version = "1", default-features = false, features = ["race", "alloc"] }
libm = "0.2"
# `HashMap` without `std` (ADR-0070 §3).
hashbrown = "0.17"
proptest = "1"
insta = "1"
# Shuyi Engine (ADR-0063 §8, ticket 1131), at the revision in
# `shuyi-engine.rev`: `cargo xtask engine-pin <commit>` moves both. The
# crates the Playdate builds without `std` have their default features off
# here; a crate that needs `std` turns it on.
shuyi-core = { git = "https://github.com/Zafnok/shuyi-engine", rev = "5aa0f666216b05db22b90776a60e608abc3c31ad", default-features = false }
shuyi-assets = { git = "https://github.com/Zafnok/shuyi-engine", rev = "5aa0f666216b05db22b90776a60e608abc3c31ad", default-features = false }
shuyi-ui = { git = "https://github.com/Zafnok/shuyi-engine", rev = "5aa0f666216b05db22b90776a60e608abc3c31ad", default-features = false }
shuyi-app = { git = "https://github.com/Zafnok/shuyi-engine", rev = "5aa0f666216b05db22b90776a60e608abc3c31ad" }
shuyi-cli = { git = "https://github.com/Zafnok/shuyi-engine", rev = "5aa0f666216b05db22b90776a60e608abc3c31ad" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Less debug info in dev and test builds (ticket 0113; `test` inherits `dev`).
# On the GNU Windows toolchain the debug info is inside each `.exe`, and a
# `cargo test --workspace` links about 20 of them into every worktree's
# `target/`. Line tables are enough for panics and backtraces to name
# file:line; third-party crates get none. Sizes are in the ticket.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# The Playdate build (ADR-0070 §1), used only by `cargo xtask playdate`:
# `--release` builds with `playdate`, otherwise `playdate-dev`. A `no_std`
# library for the device has no unwinding, so both abort on panic. Line
# tables stay in `pdex.elf` for reading crash addresses (`pdc` leaves them
# out of the game it packs); `strip` would take them away.
[profile.playdate]
inherits = "release"
panic = "abort"
lto = true
codegen-units = 1
strip = false
debug = "line-tables-only"

[profile.playdate-dev]
inherits = "dev"
panic = "abort"
