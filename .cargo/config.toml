# The local checkout of Shuyi Engine (ticket 1131): `cargo xtask engine`
# writes this file, a `[patch]` that builds the game on `shuyi-engine/`,
# and `cargo xtask engine --off` removes it. Both are git-ignored, so CI
# never has them.
include = [{ path = "engine-patch.toml", optional = true }]

[alias]
xtask = "run -q -p xtask --"
# Shuyi Engine's tools (`shuyi-cli`, ticket 1117), on the project of the
# `shuyi.ron` in the working folder or above it, with this game's tools
# (`frame-png`, `lang-status`): the engine is a dependency, so xtask runs
# them (ticket 1131).
shuyi = "xtask shuyi"

# rustup's self-contained x86_64-pc-windows-gnu linker ships without a full
# mingw-w64 import library set (e.g. no libimm32.a, which macroquad needs for
# IME support). Use a full MSYS2 mingw-w64 toolchain instead. Install with:
#   winget install -e --id MSYS2.MSYS2
#   C:\msys64\usr\bin\pacman.exe -S mingw-w64-x86_64-gcc
[target.x86_64-pc-windows-gnu]
linker = "C:/msys64/mingw64/bin/gcc.exe"
ar = "C:/msys64/mingw64/bin/ar.exe"

# The wasm32 `--allow-undefined` linker flag needed for `quad-storage`'s JS
# plugin (ticket 0207) lives in `crates/app/build.rs` instead of here: a
# `RUSTFLAGS` env var (CI sets one, for `-D warnings`) replaces this file's
# `rustflags` wholesale rather than merging with it, which would silently
# drop a flag added here.
