# The game's binary (`crates/app`) drives a window, a sound device and
# controllers through the engine's platform shell, which no test has; like
# coverage and Sonar, mutants leave it out. The engine's own code is a
# dependency (ticket 1131), never mutated here: its repository runs this
# gate on it.
#
# `crates/playdate/src/pd/` is the Playdate front end's SDK glue: built only
# with the crate's `sdk` feature for the device and the Simulator, so no
# host test compiles it, and every mutant there would count as missed
# (ticket 1031). CI's `playdate` job builds it.
#
# The engine watcher's `fetch.rs` and `main.rs` only ask `gh` about the
# engine's repository and read files (ticket 1190); no test reaches the
# network. The parsing and sorting they hand the answers to are tested.
#
# `Debuffs::visit_none` and `visit_unit` (`crates/core/src/art.rs`) return
# an empty list, which is what `Default::default()` is: that mutant changes
# nothing (ticket 0325).
exclude_re = ["Debuffs>::visit_(none|unit)"]
exclude_globs = [
    "crates/app/**",
    "crates/playdate/src/pd/**",
    "crates/engine-watch/src/fetch.rs",
    "crates/engine-watch/src/main.rs",
]
timeout_multiplier = 3.0
