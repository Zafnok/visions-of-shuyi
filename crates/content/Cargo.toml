[package]
name = "trpg-content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
# Without it the crate is `no_std` + `alloc` for the Playdate (ADR-0070 §3):
# the bundle's one layer is the table `build.rs` writes instead of
# the PC's tables, with no test files and no private layer.
std = ["shuyi-assets/std", "trpg-core/std", "serde/std"]
# Embeds the bought art in `assets-private/game/` over `assets/` (ADR-0040).
# Turned on only by builds that ship (the playtest page, the demo, release.yml) and by hand to look
# at the art; never by a gate, so tests always read the public placeholders.
private-assets = []
# Embeds the test files in `assets-test/` after `assets/` (ADR-0057): the
# test characters, chapter, battles and pictures. A debug build has them
# without this feature; it is for release-profile builds that need them (the
# tests, and `debug-tools` builds through `trpg-ui`). Never on in a build
# that ships.
test-fixtures = []
# The Playdate's bundle (`bundle::playdate_layers`, ticket 1036) with `std`
# too, for the test that plays Chapter 1 against it. Without `std` it is the
# only bundle. Never on in a PC or web build.
playdate-bundle = []
# The Chapter 1 demo's bundle (`bundle::demo_layers`, ticket 0914) beside
# the whole one, for the test that plays the demo against it. Never on in
# a build that ships: the demo edition's own build has it as its bundle
# (the `demo_edition` cfg, which `build.rs` sets).
demo-bundle = []
# Reads `assets/` and the content from the pack beside the program in place
# of embedding them (ADR-0120): the release export's desktop and web builds,
# through `trpg-app`'s `packed`. The program lays the pack in with
# `bundle::use_pack` before the first file is read.
packed = ["std"]

[dependencies]
trpg-core = { path = "../core", default-features = false }
# The bundle's layering, content errors and RON loading (ticket 1103).
shuyi-assets.workspace = true
serde.workspace = true
# `LazyLock` and float rounding without `std` (ADR-0070 §3).
once_cell.workspace = true
libm.workspace = true

[build-dependencies]
# `build.rs` converts the Playdate's pictures to one-bit (ticket 1040,
# ADR-0085): the converter, which reads the PNGs, and the battler sidecars'
# scales.
shuyi-assets = { workspace = true, features = ["png"] }
serde.workspace = true
# Walks each layer's folder and writes its table (ticket 1347): sorted,
# refusing names that aren't UTF-8 or differ only by case.
shuyi-embed.workspace = true

[dev-dependencies]
# The build script's walk, for its unit test (ticket 1347).
shuyi-embed.workspace = true
# Turns on `test-fixtures` for this crate's own tests in any profile.
trpg-content = { path = ".", features = ["test-fixtures"] }
proptest.workspace = true
# `ContentHash`, for a test's pack (ticket 1284).
shuyi-core.workspace = true
# Decodes the arrow pictures, for the test of their colours (ticket 0191).
shuyi-assets = { workspace = true, features = ["png"] }

[package.metadata.cargo-machete]
# Crate-boundary scaffolding (ADR-0004): wired up by later tickets, not yet
# referenced from src.
ignored = []
