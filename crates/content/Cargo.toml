[package]
name = "trpg-content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
# Without it the crate is `no_std` + `alloc` for the Playdate (ADR-0070 §3):
# the bundle's one layer is the table `build.rs` writes instead of
# `include_dir`, with no test files and no private layer.
std = ["dep:include_dir", "shuyi-assets/std", "trpg-core/std", "serde/std"]
# Embeds the bought art in `assets-private/game/` over `assets/` (ADR-0040).
# Turned on only by builds that ship (Pages, release.yml) and by hand to look
# at the art; never by a gate, so tests always read the public placeholders.
private-assets = []
# Embeds the test files in `assets-test/` after `assets/` (ADR-0057): the
# test characters, chapter, battles and pictures. A debug build has them
# without this feature; it is for release-profile builds that need them (the
# tests, and `debug-tools` builds through `trpg-ui`). Never on in a build
# that ships.
test-fixtures = []

[dependencies]
trpg-core = { path = "../core", default-features = false }
# The bundle's layering, content errors and RON loading (ticket 1103).
shuyi-assets = { path = "../../engine/crates/assets", default-features = false }
serde.workspace = true
include_dir = { workspace = true, optional = true }
# `LazyLock` and float rounding without `std` (ADR-0070 §3).
once_cell.workspace = true
libm.workspace = true

[dev-dependencies]
# Turns on `test-fixtures` for this crate's own tests in any profile.
trpg-content = { path = ".", features = ["test-fixtures"] }
proptest.workspace = true

[package.metadata.cargo-machete]
# Crate-boundary scaffolding (ADR-0004): wired up by later tickets, not yet
# referenced from src.
ignored = []
