[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
trpg-bots = { path = "../bots" }
# The engine watcher's report and the pin ledger's check, for `engine-pin
# --report` and `--check` (ticket 1190).
trpg-engine-watch = { path = "../engine-watch" }
# The engine's playtest runner, which `playtest` plays and judges the tries
# with (ticket 0506).
shuyi-core = { workspace = true, features = ["std"] }
trpg-content = { path = "../content" }
trpg-core = { path = "../core" }
# The Harness, for the game's `frame-png` (`game_tools`, ticket 0232).
trpg-ui = { path = "../ui", features = ["harness"] }
# Decoding the sounds and music the Playdate build converts (ticket 1047).
hound = "3.5"
lewton = "0.10"
# Shuyi's tools (ticket 1117): the generic commands moved there, and xtask
# runs them with this game's tools.
shuyi-cli.workspace = true
# The one-bit converter and its PNG reader, for `playdate-images` (ticket
# 1040).
shuyi-assets = { workspace = true, features = ["png"] }
mutants = "0.0.4"
ron.workspace = true
serde.workspace = true
# The playtest report as JSON, and its history (ticket 0505).
serde_json = "1"
serde_norway = "0.9.42"

[features]
# `frame-png` renders the bought art (ADR-0040): commit its output only as a
# screenshot of the game (`CLAUDE.md`, *Bought art*).
private-assets = ["trpg-content/private-assets"]
