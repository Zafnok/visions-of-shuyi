[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license-file.workspace = true
repository.workspace = true

# The repository's process tool (ADR-0129): the ticket lint, pr-size and
# the other checks every commit and push runs. It builds in seconds because
# it depends on no crate of the game and none of the engine's: the game's
# tool program is `trpg-tools` (`crates/tools`), and the commands that moved
# there still answer here, run through it.

[lints]
workspace = true

[dependencies]
# The engine watcher's report and the pin ledger's check, for `engine-pin
# --report` and `--check` (ticket 1190). Its only dependency is serde_json.
trpg-engine-watch = { path = "../engine-watch" }
mutants = "0.0.4"
# The `pr-size` hook's input and answer (ticket 0135).
serde_json = "1"
# The tickets' frontmatter, `gh`'s answers and the workflow files.
serde_norway = "0.9.42"

[features]
# Passed on to `trpg-tools` when a command forwards there, so
# `cargo run -p xtask --features private-assets -- readme-pictures` still
# draws the bought art (ADR-0040).
private-assets = []
