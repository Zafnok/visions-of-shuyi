[package]
name = "trpg-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
trpg-core = { path = "../core", default-features = false }
trpg-content = { path = "../content", default-features = false }
thiserror.workspace = true
# The player's saved key bindings (ticket 0217, ADR-0031).
serde.workspace = true
ron.workspace = true
# `LazyLock`, float maths and `HashMap` without `std` (ADR-0070 §3).
once_cell.workspace = true
libm.workspace = true
hashbrown.workspace = true

[features]
default = ["std"]
# Without it the crate is `no_std` + `alloc` for the Playdate (ADR-0070 §3).
std = ["trpg-core/std", "trpg-content/std", "ron/std", "thiserror/std", "serde/std"]
# The headless test `Harness` (src/harness.rs), for integration tests. It
# starts games in the test chapter, so it brings the test files (ADR-0057).
harness = ["trpg-content/test-fixtures"]
# Debug tools (Quick Battle, glyph sampler) in a release build: the Pages
# build only (ADR-0023). Never on in shipped builds. The Quick Battle is
# made of the test files (ADR-0057).
debug-tools = ["trpg-content/test-fixtures"]

[dev-dependencies]
# Turns on `harness` for this crate's own integration tests in tests/.
trpg-ui = { path = ".", features = ["harness"] }
proptest.workspace = true
insta.workspace = true
