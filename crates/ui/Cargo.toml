[package]
name = "trpg-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
trpg-core = { path = "../core", default-features = false }
trpg-content = { path = "../content", default-features = false }
# The frame (1108), input: keymaps, repeat, controllers, saved bindings
# and help keys (1107), and screens, the context and the frame loop (1109).
shuyi-ui.workspace = true
# The engine's asset types the context reads through this game's data
# (1109): the text by key.
shuyi-assets.workspace = true
# The engine's test Harness, for the `harness` feature (engine ADR-0024).
shuyi-platform = { workspace = true, optional = true }
# The player's saved settings (ADR-0050) and the game's saves.
serde.workspace = true
ron.workspace = true

[features]
default = ["std"]
# Without it the crate is `no_std` + `alloc` for the Playdate (ADR-0070 §3).
std = [
    "trpg-core/std",
    "trpg-content/std",
    "shuyi-ui/std",
    "shuyi-assets/std",
    "ron/std",
    "serde/std",
]
# The headless test `Harness` (src/harness.rs, over the engine's), for
# integration tests. It starts games in the test chapter, so it brings the
# test files (ADR-0057).
harness = [
    "storage-conformance",
    "trpg-content/test-fixtures",
    "shuyi-platform/harness",
]
# `storage::conformance_suite`, for a platform's `Storage` (also without
# `std`: the Playdate's debug build runs it on the device's files).
storage-conformance = ["shuyi-ui/storage-conformance"]
# Debug tools (Quick Battle, glyph sampler) in a release build: the Pages
# build only (ADR-0023). Never on in shipped builds. The Quick Battle is
# made of the test files (ADR-0057).
debug-tools = ["trpg-content/test-fixtures", "shuyi-ui/debug-tools"]
# `onebit::reference`, the plain one-bit renderer the fast one must equal
# (ticket 1055): for the Playdate's bench build, which times both on the
# device. The tests have it anyway.
onebit-reference = ["shuyi-ui/onebit-reference"]

[dev-dependencies]
# Turns on `harness` for this crate's own integration tests in tests/, and
# the one-bit reference renderer `tests/it/playdate.rs` compares with.
trpg-ui = { path = ".", features = ["harness", "onebit-reference"] }
# A sample game's actions, for a menu driven by another game's actions.
shuyi-assets = { workspace = true, features = ["std", "sample-actions"] }
proptest.workspace = true
insta.workspace = true
