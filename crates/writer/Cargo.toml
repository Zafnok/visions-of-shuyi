[package]
name = "trpg-writer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

# The writer's programs (ticket 0152, ADR-0122): `story-check`, the checks a
# dialogue script goes through, for a computer with no source code. Built
# by `.github/workflows/story-kit.yml` with the game's content checked out
# (it embeds it) and uploaded to the writer's private mirror, never as a
# public artifact. `cargo xtask check-script` runs the same checks.
[[bin]]
name = "story-check"
path = "src/main.rs"

[dependencies]
trpg-content = { path = "../content" }
