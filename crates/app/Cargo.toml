[package]
name = "trpg-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "visions-of-shuyi"
path = "src/main.rs"

[features]
# Debug tools (Quick Battle, glyph sampler) in a release build: turned on only
# by the Pages build, `cargo shuyi web --release --debug-tools` (ADR-0023).
# Never by release.yml, itch.io or Steam builds.
debug-tools = ["trpg-ui/debug-tools"]
# The bought art, embedded over `assets/` (ADR-0040): needs
# `assets-private/game/` (`cargo shuyi private-assets`). Turned on by the
# Pages build and release.yml when they have the key, never by a gate.
private-assets = ["trpg-content/private-assets"]
# Reads the game's files from `trpg-app.pack` beside the program in place of
# embedding them (ADR-0120, engine ADR-0110): `cargo shuyi export <target>
# --release` turns it on for the desktops and the web, and bakes the pack
# with the game's tools. Never on in a debug build, the tests or the Playdate.
packed = ["trpg-content/packed"]

[dependencies]
trpg-core = { path = "../core" }
trpg-content = { path = "../content" }
trpg-ui = { path = "../ui" }
# What `src/app_info.rs`, written by `cargo shuyi app-info`, names `AppInfo`
# through (ticket 1199).
shuyi.workspace = true
# The window, input devices, audio, storage and the run loop (ticket 1110).
shuyi-app.workspace = true
# The entry point: `#[macroquad::main]` has to be in the binary.
macroquad.workspace = true

# The exe's icon and version info (ticket 0902), on a Windows host only.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
