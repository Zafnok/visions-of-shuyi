[package]
name = "trpg-bots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

# Dev tooling (ADR-0033): used only by `xtask` and tests. Never a dependency
# of `trpg-ui` or `trpg-app`, and never depends on them (ADR-0038).
[dependencies]
# The play loop and the `Bot` trait (ticket 1116).
shuyi-core = { workspace = true, features = ["std"] }
trpg-core = { path = "../core" }
# The battle files the autobalance's knobs change, loaded as the content
# check does (ticket 0509).
trpg-content = { path = "../content" }
# `personas.ron` and `targets.ron` (ticket 0506).
ron = { workspace = true, features = ["std"] }
serde.workspace = true

[dev-dependencies]
# The game's tables and battle files, for tests on real battles, and the
# test files' (ADR-0057).
trpg-content = { path = "../content", features = ["test-fixtures"] }
# The random battles every persona must play without a refused command.
proptest.workspace = true
