name: Release

# Cuts a GitHub Release from a `vX.Y.Z` tag (ADR-0009): `cargo shuyi export`
# makes Windows, Linux, macOS (universal) and web packages (ticket 0910,
# ADR-0108) and checks each one. `workflow_dispatch` runs the exact same
# pipeline as a dry run, without the release, so it can be exercised on a
# branch before ever pushing a tag.
#
# Every package embeds the bought art (ADR-0040) and the game's content
# (ADR-0117), checked out from the private repository with
# PRIVATE_ASSETS_KEY. A real release from this repository fails without the
# key; a dry run or a fork builds with the public files and warns.
#
# So no package leaves its job through GitHub (ticket 0158): a public
# repository's releases and workflow artifacts can be downloaded by anyone
# (ADR-0117 §4). Until the store's itch.io page exists (ticket 0901, which
# adds a push to it in each package job), a package is built, checked and
# left behind, and the GitHub Release holds the notes and each package's
# reports. The debug file (Windows and Linux) is the whole program before
# stripping, content and all: on a real release each job puts it straight on
# a release of the private assets repository (ticket 0917, DEBUG_FILES_TOKEN),
# never on this repository's release or an artifact.
#
# See docs/releasing.md for how to actually cut one.
#
# Deliberately no Swatinem/rust-cache here (unlike ci.yml): this workflow
# runs rarely (once per release) and its output ships to players, so a full,
# uncached build is worth the extra minutes — it also sidesteps the
# cache-poisoning risk a `push: tags` + `workflow_dispatch` workflow writing
# to a shared cache would otherwise carry (flagged by zizmor).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      fake_tag:
        description: >-
          Dry-run only: tag to check against Cargo.toml's version instead of
          the real workspace version (e.g. a bogus "v0.0.0" to verify
          check-version fails as expected). Leave blank for a normal dry run.
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Establishes the version for this run and whether this is a real release
  # or a dry run, and fails fast on a tag/Cargo.toml mismatch (implementation
  # step 2).
  check-version:
    name: check-version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          FAKE_TAG: ${{ inputs.fake_tag }}
        run: |
          set -euo pipefail
          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "trpg-app") | .version')

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            dry_run=true
            tag="${FAKE_TAG:-v$cargo_version}"
          else
            dry_run=false
            tag="${GITHUB_REF#refs/tags/}"
          fi
          tag_version="${tag#v}"

          echo "tag=$tag cargo_version=$cargo_version dry_run=$dry_run"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::tag '$tag' (version '$tag_version') does not match" \
              "workspace.package.version '$cargo_version' in Cargo.toml"
            exit 1
          fi

          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

  # The crates' licenses (ADR-0013), which shuyi.ron ships in every package.
  licenses:
    name: licenses
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-about
      # `-m crates/app/Cargo.toml` scopes the report to trpg-app's own
      # dependency tree so our unpublished, license-less workspace crates
      # (core/content/ui) don't need entries; about.toml's `accepted` list is
      # the same allow list as deny.toml's `[licenses] allow` (ADR-0013).
      - run: |
          cargo about generate -m crates/app/Cargo.toml about.hbs \
            -o THIRD_PARTY_LICENSES.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licenses
          path: THIRD_PARTY_LICENSES.html
          retention-days: 1

  # One job per target: `cargo shuyi export` (shuyi.ron's `export` part, ticket
  # 0910) builds and packages it, then the package is checked and given the
  # release's name. The Linux package builds in Valve's Steam Linux Runtime 3.0
  # ("sniper") SDK, whose glibc 2.31 is the floor, at the engine CI's digest.
  package:
    name: package (${{ matrix.target }})
    needs: [check-version, licenses]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            release_name: windows-x64
          - target: linux
            os: ubuntu-latest
            release_name: linux-x64
            container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:3.0.20261007.263965@sha256:220d1dc739254155a91c010f959a4f8e7c183e69d18300d6be53a20aee12b02d
          - target: macos
            os: macos-latest
            release_name: macos-universal
          - target: web
            os: ubuntu-latest
            release_name: web
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # git and ssh are for the bought art's checkout.
      - name: Set up the sniper SDK
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git openssh-client ca-certificates curl jq \
            build-essential pkg-config libasound2-dev libudev-dev libx11-dev libxi-dev \
            libxkbcommon-dev libgl1-mesa-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - id: private
        uses: ./.github/actions/private-assets
        with:
          key: ${{ secrets.PRIVATE_ASSETS_KEY }}
          content: "true"
          required: ${{ github.repository == 'Zafnok/visions-of-shuyi' && needs.check-version.outputs.dry_run == 'false' }}
      - run: rustup toolchain install --no-self-update
      # .cargo/config.toml links the GNU target with MSYS2's mingw-w64 GCC,
      # whose binutils give `objcopy` and `windres`.
      - name: Set up the Windows GNU target
        if: matrix.target == 'windows'
        run: |
          /c/msys64/usr/bin/pacman.exe -Sy --noconfirm --needed mingw-w64-x86_64-gcc
          echo 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"
          rustup target add x86_64-pc-windows-gnu
      - name: Set up both Mac targets
        if: matrix.target == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: licenses
          path: dist/licenses
      # The export's own cargo commands don't take --locked.
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Export
        env:
          WITHOUT_ART: ${{ steps.private.outputs.export-flag }}
        run: cargo shuyi export "$TARGET" --release $WITHOUT_ART
      - name: Check the package
        env:
          ART: ${{ steps.private.outputs.features }}
        run: bash scripts/check-release-package.sh "$TARGET" "dist/export/$TARGET" $ART
      # The debug file reads a player's crash report and embeds the content, so
      # a real release keeps it private: a release of the private assets
      # repository named after the version (docs/releasing.md, "The debug
      # files"). A dry run built and checked it above and uploads nothing.
      - name: Keep the debug file private
        if: >-
          (matrix.target == 'windows' || matrix.target == 'linux')
          && needs.check-version.outputs.dry_run == 'false'
        env:
          DEBUG_FILES_TOKEN: ${{ secrets.DEBUG_FILES_TOKEN }}
          DEBUG_FILES_REPO: Zafnok/visions-of-shuyi-assets
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ needs.check-version.outputs.version }}
          NAME: visions-of-shuyi-${{ needs.check-version.outputs.version }}-${{ matrix.release_name }}.debug
        run: |
          set -euo pipefail
          from="dist/export/$TARGET"
          folder=$(jq -r .folder "$from/export-report.json" | tr -d '\r')
          bash scripts/upload-debug-file.sh "$from/$folder.debug" "debug-v$VERSION" "$NAME"
      # The `.app` keeps its signature and its program's mode in a zip `ditto`
      # writes; the export leaves macOS's package a folder.
      - name: Zip the macOS package
        if: matrix.target == 'macos'
        working-directory: dist/export/macos
        run: ditto -c -k --keepParent "$(ls -d visions-of-shuyi-*-macos)" package.zip
      # What may leave the job: the two reports, which name each file with
      # its size and hash and never hold the files' text. The package stays
      # behind (ticket 0158); 0901 pushes the package to itch.io from here.
      - name: Keep the reports
        env:
          NAME: visions-of-shuyi-${{ needs.check-version.outputs.version }}-${{ matrix.release_name }}
        run: |
          set -euo pipefail
          from="dist/export/$TARGET"
          mkdir -p dist/release/kept
          mv "$from/export-report.json" "dist/release/kept/$NAME.export-report.json"
          mv "$from/exposure-report.json" "dist/release/kept/$NAME.exposure-report.json"
      # A guard on that: only the reports, and none holds a line of the
      # game's dialogue, public or private.
      - name: Check the reports hold no content
        run: |
          set -euo pipefail
          others=$(find dist/release/kept -type f ! -name '*-report.json')
          if [ -n "$others" ]; then
            echo "::error::Only the reports leave the job: $others"
            exit 1
          fi
          roots=assets
          if [ -d assets-private/content ]; then roots="$roots assets-private/content"; fi
          # shellcheck disable=SC2086 # two folder names, no spaces
          find $roots -name '*.dlg' -exec cat {} + \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | awk 'length($0) >= 24' \
            | sort -u > "$RUNNER_TEMP/lines.txt"
          echo "Searching the reports for $(wc -l < "$RUNNER_TEMP/lines.txt") dialogue lines"
          if grep -F -l -f "$RUNNER_TEMP/lines.txt" dist/release/kept/*; then
            echo "::error::A report holds a line of dialogue."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kept-${{ matrix.target }}
          path: dist/release/kept/*

  # Only this job needs write access, and only for a real (non-dry-run) run.
  release:
    name: release
    if: needs.check-version.outputs.dry_run == 'false'
    needs: [check-version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kept-*
          merge-multiple: true
          path: kept
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: kept/*
          generate_release_notes: true
