name: Release

# Cuts a GitHub Release from a `vX.Y.Z` tag (ADR-0009): `cargo shuyi export`
# makes each package `cargo shuyi export --plan` says CI builds (Windows,
# Linux, macOS universal and web; ticket 0910, ADR-0108, ticket 1267), checks
# each one and records its SHA-256 in SHA256SUMS. `workflow_dispatch` runs the exact same
# pipeline as a dry run, without the release, so it can be exercised on a
# branch before ever pushing a tag.
#
# Every package embeds the bought art (ADR-0040) and the game's content
# (ADR-0117), checked out from the private repository with
# PRIVATE_ASSETS_KEY. A real release from this repository fails without the
# key; a dry run or a fork builds with the public files and warns.
#
# So no package leaves its job through GitHub (ticket 0158): a public
# repository's releases and workflow artifacts can be downloaded by anyone
# (ADR-0117 §4). Until the store's itch.io page exists (ticket 0901, which
# adds a push to it in each package job), a package is built, checked and
# left behind, and the GitHub Release holds the notes and each package's
# reports. The debug file (Windows and Linux) is the whole program before
# stripping, content and all: on a real release each job puts it straight on
# a release of the private assets repository (ticket 0917, DEBUG_FILES_TOKEN),
# never on this repository's release or an artifact.
#
# See docs/releasing.md for how to actually cut one.
#
# Deliberately no Swatinem/rust-cache here (unlike ci.yml): this workflow
# runs rarely (once per release) and its output ships to players, so a full,
# uncached build is worth the extra minutes — it also sidesteps the
# cache-poisoning risk a `push: tags` + `workflow_dispatch` workflow writing
# to a shared cache would otherwise carry (flagged by zizmor).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      fake_tag:
        description: >-
          Dry-run only: a tag for `cargo shuyi export --plan --tag` to check
          against the game's version (e.g. a bogus "v0.0.0" to verify
          check-version fails as expected). Leave blank for a normal dry run.
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The version, whether this is a real release or a dry run, and the
  # package matrix, all from `cargo shuyi export --plan` (engine ADR-0114):
  # each target shuyi.ron lists that CI builds, with its runner and image
  # (the sniper SDK's, at the engine's digest), beside the name the game's
  # release gives it. With a tag (a push, or a dry run's fake_tag) the plan
  # fails unless the tag is `v` and the version.
  check-version:
    name: check-version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          FAKE_TAG: ${{ inputs.fake_tag }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(export --plan --json)
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            dry_run=true
            if [ -n "$FAKE_TAG" ]; then args+=(--tag "$FAKE_TAG"); fi
          else
            dry_run=false
            args+=(--tag "$TAG")
          fi
          if ! cargo shuyi "${args[@]}" > plan.json; then
            jq -r '"::error::export --plan: \(.error // "failed")", (.help // empty)' plan.json || cat plan.json
            exit 1
          fi
          # The plan's hosts on GitHub's runners, as the engine's template
          # maps them; a target the game's release doesn't name yet fails,
          # and so does an image not pinned by its digest.
          matrix=$(jq -c '{include: [.result.exports[] | select(.ci == "build") | {
              target: .exporter,
              runner: ({windows: "windows-latest", macos: "macos-latest", linux: "ubuntu-latest",
                        "linux-arm64": "ubuntu-24.04-arm"}[.host] // error("no runner for host \(.host)")),
              container: (.container // "" | if . == "" or test("@sha256:[0-9a-f]{64}$") then .
                          else error("the image \(.) is not pinned by its digest") end),
              release_name: ({windows: "windows-x64", linux: "linux-x64", macos: "macos-universal",
                              web: "web"}[.exporter] // error("no release name for \(.exporter)"))
            }]}' plan.json)
          {
            echo "version=$(jq -r .result.version plan.json)"
            echo "dry_run=$dry_run"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### The packages of version $(jq -r .result.version plan.json)"
            echo
            jq -r '.result.exports[] | if .ci == "build" then "- `\(.exporter)`: built on \(.host)" else "- `\(.exporter)`: checked only, \(.why)" end' plan.json
            jq -r '.limits[] | "- \(.)"' plan.json
          } >> "$GITHUB_STEP_SUMMARY"

  # The crates' licenses (ADR-0013), which shuyi.ron ships in every package.
  licenses:
    name: licenses
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-about
      # `-m crates/app/Cargo.toml` scopes the report to trpg-app's own
      # dependency tree so our unpublished, license-less workspace crates
      # (core/content/ui) don't need entries; about.toml's `accepted` list is
      # the same allow list as deny.toml's `[licenses] allow` (ADR-0013).
      - run: |
          cargo about generate -m crates/app/Cargo.toml about.hbs \
            -o THIRD_PARTY_LICENSES.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licenses
          path: THIRD_PARTY_LICENSES.html
          retention-days: 1

  # One job per target: `cargo shuyi export` (shuyi.ron's `export` part, ticket
  # 0910) builds and packages it, then the package is checked and given the
  # release's name. Its runner and image are the plan's (check-version): the
  # Linux package builds in Valve's Steam Linux Runtime 3.0 ("sniper") SDK,
  # whose glibc 2.31 is the floor.
  package:
    name: package (${{ matrix.target }})
    needs: [check-version, licenses]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-version.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # zizmor can't read a matrix from a job's output: check-version refuses
    # an image without its digest.
    container: ${{ matrix.container }} # zizmor: ignore[unpinned-images]
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # git and ssh are for the bought art's checkout.
      - name: Set up the sniper SDK
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git openssh-client ca-certificates curl jq \
            build-essential pkg-config libasound2-dev libudev-dev libx11-dev libxi-dev \
            libxkbcommon-dev libgl1-mesa-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - id: private
        uses: ./.github/actions/private-assets
        with:
          key: ${{ secrets.PRIVATE_ASSETS_KEY }}
          content: "true"
          required: ${{ github.repository == 'Zafnok/visions-of-shuyi' && needs.check-version.outputs.dry_run == 'false' }}
      - run: rustup toolchain install --no-self-update
      # .cargo/config.toml links the GNU target with MSYS2's mingw-w64 GCC,
      # whose binutils give `objcopy` and `windres`.
      - name: Set up the Windows GNU target
        if: matrix.target == 'windows'
        run: |
          /c/msys64/usr/bin/pacman.exe -Sy --noconfirm --needed mingw-w64-x86_64-gcc
          echo 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"
          rustup target add x86_64-pc-windows-gnu
      - name: Set up both Mac targets
        if: matrix.target == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # A release web export runs wasm-opt and fails without it (engine
      # ADR-0094, ticket 0916).
      - name: Set up Binaryen
        if: matrix.target == 'web'
        uses: ./.github/actions/binaryen
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: licenses
          path: dist/licenses
      # The export's own cargo commands don't take --locked.
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Export
        env:
          WITHOUT_ART: ${{ steps.private.outputs.export-flag }}
        run: cargo shuyi export "$TARGET" --release $WITHOUT_ART
      - name: Check the package
        env:
          ART: ${{ steps.private.outputs.features }}
        run: bash scripts/check-release-package.sh "$TARGET" "dist/export/$TARGET" $ART
      # The debug file reads a player's crash report and embeds the content, so
      # a real release keeps it private: a release of the private assets
      # repository named after the version (docs/releasing.md, "The debug
      # files"). A dry run built and checked it above and uploads nothing.
      - name: Keep the debug file private
        if: >-
          (matrix.target == 'windows' || matrix.target == 'linux')
          && needs.check-version.outputs.dry_run == 'false'
        env:
          DEBUG_FILES_TOKEN: ${{ secrets.DEBUG_FILES_TOKEN }}
          DEBUG_FILES_REPO: Zafnok/visions-of-shuyi-assets
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ needs.check-version.outputs.version }}
          NAME: visions-of-shuyi-${{ needs.check-version.outputs.version }}-${{ matrix.release_name }}.debug
        run: |
          set -euo pipefail
          from="dist/export/$TARGET"
          folder=$(jq -r .folder "$from/export-report.json" | tr -d '\r')
          bash scripts/upload-debug-file.sh "$from/$folder.debug" "debug-v$VERSION" "$NAME"
      # The `.app` keeps its signature and its program's mode in a zip `ditto`
      # writes; the export leaves macOS's package a folder.
      - name: Zip the macOS package
        if: matrix.target == 'macos'
        working-directory: dist/export/macos
        run: |
          set -euo pipefail
          package=$(ls -d visions-of-shuyi-*-macos)
          ditto -c -k --keepParent "$package" "$package.zip"
      # The package's SHA-256, its line of the release's SHA256SUMS: the
      # digest leaves the job, the package doesn't.
      - name: The package's SHA-256
        env:
          NAME: visions-of-shuyi-${{ needs.check-version.outputs.version }}-${{ matrix.release_name }}
        run: |
          set -euo pipefail
          from="dist/export/$TARGET"
          package=$(jq -r .package "$from/export-report.json" | tr -d '\r')
          if [ -d "$from/$package" ]; then package="$package.zip"; fi
          if command -v sha256sum > /dev/null; then sum=(sha256sum); else sum=(shasum -a 256); fi
          mkdir -p dist/release/kept
          # One form on every system: `<hash>  <file>` (no binary-mode `*`).
          (cd "$from" && "${sum[@]}" "$package") | sed 's/^\([0-9a-f]*\) [ *]/\1  /' \
            > "dist/release/kept/$NAME.sha256"
          { echo '```'; cat "dist/release/kept/$NAME.sha256"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # What may leave the job: the two reports, which name each file with
      # its size and hash and never hold the files' text, and the package's
      # SHA-256. The package stays behind (ticket 0158); 0901 pushes the
      # package to itch.io from here.
      - name: Keep the reports
        env:
          NAME: visions-of-shuyi-${{ needs.check-version.outputs.version }}-${{ matrix.release_name }}
        run: |
          set -euo pipefail
          from="dist/export/$TARGET"
          mkdir -p dist/release/kept
          mv "$from/export-report.json" "dist/release/kept/$NAME.export-report.json"
          mv "$from/exposure-report.json" "dist/release/kept/$NAME.exposure-report.json"
      # A guard on that: only the reports and the SHA-256, and no report
      # holds a line of the game's dialogue, public or private.
      - name: Check the reports hold no content
        run: |
          set -euo pipefail
          others=$(find dist/release/kept -type f ! -name '*-report.json' ! -name '*.sha256')
          if [ -n "$others" ]; then
            echo "::error::Only the reports and the SHA-256 leave the job: $others"
            exit 1
          fi
          roots=assets
          if [ -d assets-private/content ]; then roots="$roots assets-private/content"; fi
          # shellcheck disable=SC2086 # two folder names, no spaces
          find $roots -name '*.dlg' -exec cat {} + \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | awk 'length($0) >= 24' \
            | sort -u > "$RUNNER_TEMP/lines.txt"
          echo "Searching the reports for $(wc -l < "$RUNNER_TEMP/lines.txt") dialogue lines"
          if grep -F -l -f "$RUNNER_TEMP/lines.txt" dist/release/kept/*; then
            echo "::error::A report holds a line of dialogue."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kept-${{ matrix.target }}
          path: dist/release/kept/*

  # Every package's line together, SHA256SUMS, on a dry run too: in the
  # run's summary and as an artifact for the release.
  sums:
    name: sums
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kept-*
          merge-multiple: true
          path: kept
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cat kept/*.sha256 | sort -k 2 > SHA256SUMS
          { echo '### SHA256SUMS'; echo; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256sums
          path: SHA256SUMS
          if-no-files-found: error

  # Only this job needs write access, and only for a real (non-dry-run) run:
  # the release, and the attestations of where each package was built. They
  # attest SHA256SUMS's digests, as no package is published (ticket 0158);
  # `gh attestation verify <package> --repo Zafnok/visions-of-shuyi` checks
  # one (docs/releasing.md).
  release:
    name: release
    if: needs.check-version.outputs.dry_run == 'false'
    needs: [check-version, sums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kept-*
          merge-multiple: true
          path: kept
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
          path: kept
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: kept/SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            kept/*-report.json
            kept/SHA256SUMS
          generate_release_notes: true
