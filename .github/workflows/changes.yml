name: Changes

# Reusable: decides whether a pull request touches anything besides docs, so
# heavy jobs can be skipped with `if:` (a skipped job still reports a status,
# unlike a workflow skipped by a `paths` filter). See ADR-0014.
#
# Docs-only paths: `*.md` anywhere, `docs/**`, `tickets/**`, `.claude/**`.
# Any other event (push, schedule, workflow_dispatch) always counts as code.
#
# But a Markdown file the code reads (a test checks it against the data)
# isn't skipped: PR #464 changed only `docs/design/audio.md`, skipped the
# tests, and broke `main` (ticket 0252, ADR-0098). Its `read by` line below
# names the crates that read it; they go in `doc_crates`, and CI's
# `doc-tests` job runs only their tests. xtask's
# `every_markdown_file_the_code_reads_is_tested` keeps those lines complete.

on:
  workflow_call:
    outputs:
      code:
        description: "'true' unless the event is a pull request that only changes docs-only paths"
        value: ${{ jobs.detect.outputs.code }}
      doc_crates:
        description: "The crates that read a Markdown file the pull request changes, space-separated (ADR-0098)"
        value: ${{ jobs.detect.outputs.doc_crates }}

permissions:
  contents: read

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      doc_crates: ${{ steps.classify.outputs.doc_crates }}
    steps:
      # On pull_request, HEAD is the PR merge commit; HEAD^1 is the base tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event $EVENT_NAME: always run everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          doc_crates=""
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              THIRD_PARTY_ASSETS.md|assets/dialogue/README.md|assets/maps/README.md|docs/design/audio.md|docs/story/names.md) echo "read by trpg-content: $path"; doc_crates="$doc_crates trpg-content" ;;
              docs/engine/pins.md) echo "read by trpg-engine-watch: $path"; doc_crates="$doc_crates trpg-engine-watch" ;;
              docs/story/writers-guide.md|tickets/README.md) echo "read by xtask: $path"; doc_crates="$doc_crates xtask" ;;
              *.md|docs/*|tickets/*|.claude/*) echo "docs: $path" ;;
              *) echo "code: $path"; code=true ;;
            esac
          done < <(git diff --name-only --no-renames HEAD^1 HEAD)
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          doc_crates=$(echo $doc_crates | xargs -n1 | sort -u | xargs)
          echo "doc_crates=$doc_crates"
          echo "doc_crates=$doc_crates" >> "$GITHUB_OUTPUT"
