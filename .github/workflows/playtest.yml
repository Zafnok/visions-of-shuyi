name: Playtest

# The playtest personas (ticket 0506, docs/playtesting.md) play every battle
# in assets/battles 100 times each. The job fails only when a battle is
# blocked: the Casual persona succeeds in under 20% of tries
# (docs/design/playtest-bots.md, "What a miss does"). A band missed (✗ too
# hard, ⚠ too easy) is only reported, in the summary of the `playtest`
# job.
#
# Each battle is played in a job of its own (ticket 0530): `build` makes
# xtask once and lists the battles, `play` plays one battle per job, and
# `playtest` gathers their reports into one summary. It fails when a
# battle is blocked or was not played (its job failed or ran out of time).
#
# It plays only when a balance lever changed (ticket 0514): the battles and
# maps, the number tables in assets/data, the rules, how content becomes a
# battle, the bots, the engine pin, or the playtest itself. The list is
# .github/playtest-levers.sh. That holds for pull requests and for pushes
# to main; "Run workflow" (workflow_dispatch) always plays. As ADR-0014
# asks, the workflow always runs and reports, and the job is skipped by
# `if:` (never by a workflow-level `paths` filter).
#
# A push to main is never cancelled by the next push (ticket 0515): each
# push diffs only its own commits, so a cancelled run's balance change
# would go unplayed (on 2026-10-22 two lever pushes were cancelled by a
# third that changed no lever, and skipped). A pull request's newer commit
# still cancels its older run; its range HEAD^1 HEAD covers both.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push to main is never cancelled: the next push diffs only its
  # own commits, so a cancelled run's balance change would go unplayed
  # (ticket 0515). A PR's newer commit supersedes its older one.
  group: playtest-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      play: ${{ steps.classify.outputs.play }}
    steps:
      # Enough history for the diff: on pull_request HEAD is the PR merge
      # commit and HEAD^1 the base tip; on push, the commits pushed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) range="HEAD^1 HEAD" ;;
            push)
              # A new branch or a force-push whose old tip is gone: play.
              if [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                echo "No earlier commit to compare with: play."
                echo "play=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              range="$BEFORE HEAD" ;;
            *)
              echo "Event $EVENT_NAME: always play."
              echo "play=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          # shellcheck disable=SC2086 # the range is two words on purpose
          git diff --name-only --no-renames $range | bash .github/playtest-levers.sh | tee levers.txt
          grep '^play=' levers.txt >> "$GITHUB_OUTPUT"

  # Builds xtask once for every battle job, and lists the battles: every
  # file in assets/battles, so a new battle is played without editing
  # this workflow (ticket 0530).
  build:
    name: build
    needs: detect
    if: needs.detect.outputs.play == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      battles: ${{ steps.battles.outputs.battles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List the battles
        id: battles
        run: |
          set -euo pipefail
          battles=$(for file in assets/battles/*.ron; do basename "$file" .ron; done | jq -R . | jq -sc .)
          echo "$battles"
          echo "battles=$battles" >> "$GITHUB_OUTPUT"
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install macroquad system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - run: cargo build --release --locked -p xtask
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playtest-xtask
          path: target/release/xtask
          retention-days: 1
          if-no-files-found: error

  # One job per battle (ticket 0530): one job playing them all in turn ran
  # past its 150 minutes once the Act 1 skirmishes came (14 battles, and a
  # CI machine's speed varies about 2x). A battle's three personas stay in
  # one `--bot all` run: the targets' "faster" check compares two of them.
  # The slowest battle (ch03) took 29 minutes on a slow machine.
  # max-parallel leaves room for the other workflows' jobs.
  play:
    name: play (${{ matrix.battle }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        battle: ${{ fromJSON(needs.build.outputs.battles) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # xtask finds the repository from the path it was built at, which is
      # this same checkout path on every runner.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playtest-xtask
          path: target/release
      - name: Play the battle
        env:
          BATTLE: ${{ matrix.battle }}
        run: |
          set -uo pipefail
          # An artifact loses the file's mode.
          chmod +x target/release/xtask
          mkdir -p reports
          target/release/xtask playtest "$BATTLE" --bot all | tee "reports/$BATTLE.txt"
          echo "${PIPESTATUS[0]}" > "reports/$BATTLE.status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playtest-report-${{ matrix.battle }}
          path: reports/
          retention-days: 7
          if-no-files-found: error
      - name: Fail if the battle is blocked
        env:
          BATTLE: ${{ matrix.battle }}
        run: |
          status=$(cat "reports/$BATTLE.status")
          if [ "$status" -ne 0 ]; then
            echo "::error::$BATTLE: blocked (or the playtest failed), exit $status"
            exit 1
          fi

  # Gathers every battle's report into one summary, in the battles'
  # order, and fails when a battle is blocked or was not played.
  playtest:
    name: playtest
    needs: [detect, build, play]
    if: ${{ !cancelled() && needs.detect.outputs.play == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No report at all (every battle job failed) is told below, battle
      # by battle, as "not played".
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: playtest-report-*
          path: reports
          merge-multiple: true
      - name: Gather the reports
        env:
          BUILD: ${{ needs.build.result }}
          BATTLES: ${{ needs.build.outputs.battles }}
        run: |
          set -euo pipefail
          if [ "$BUILD" != success ] || [ -z "$BATTLES" ]; then
            echo "::error::the build of xtask failed: no battle was played"
            exit 1
          fi
          failed=0
          for battle in $(jq -r '.[]' <<< "$BATTLES"); do
            echo "### $battle" >> "$GITHUB_STEP_SUMMARY"
            if [ ! -f "reports/$battle.status" ]; then
              echo "::error::$battle: not played (its job failed or ran out of time)"
              echo "Not played: its job failed or ran out of time." >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            {
              echo '```'
              # The table and the game's lines, without one line per try.
              grep -v '^try ' "reports/$battle.txt" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            status=$(cat "reports/$battle.status")
            if [ "$status" -ne 0 ]; then
              echo "::error::$battle: blocked (or the playtest failed), exit $status"
              failed=1
            fi
          done
          exit $failed
