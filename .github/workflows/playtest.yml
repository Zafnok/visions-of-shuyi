name: Playtest

# The playtest personas (ticket 0506, docs/playtesting.md) play every battle
# in assets/battles 100 times each. The job fails only when a battle is
# blocked: the Casual persona succeeds in under 20% of tries
# (docs/design/playtest-bots.md, "What a miss does"). A band missed (✗ too
# hard, ⚠ too easy) is only reported, in the job summary.
#
# It plays only when the battles or what decides them changed: the battle
# data (assets/), the rules (crates/core/), the bots (crates/bots/) or the
# engine's pin. As ADR-0014 asks, the workflow always runs and reports, and
# the job is skipped by `if:` (never by a workflow-level `paths` filter).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: playtest-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      play: ${{ steps.classify.outputs.play }}
    steps:
      # On pull_request, HEAD is the PR merge commit; HEAD^1 is the base tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event $EVENT_NAME: always play."
            echo "play=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          play=false
          while IFS= read -r path; do
            case "$path" in
              *.md) ;;
              assets/*|crates/core/*|crates/bots/*|shuyi-engine.rev|.github/workflows/playtest.yml)
                echo "plays: $path"; play=true ;;
            esac
          done < <(git diff --name-only --no-renames HEAD^1 HEAD)
          echo "play=$play"
          echo "play=$play" >> "$GITHUB_OUTPUT"

  playtest:
    name: playtest
    needs: detect
    if: needs.detect.outputs.play == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install macroquad system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - run: cargo build --release --locked -p xtask
      - name: Play every battle
        run: |
          set -uo pipefail
          blocked=0
          for file in assets/battles/*.ron; do
            battle=$(basename "$file" .ron)
            echo "::group::$battle"
            target/release/xtask playtest "$battle" --bot all | tee "report-$battle.txt"
            status=${PIPESTATUS[0]}
            echo "::endgroup::"
            {
              echo "### $battle"
              echo '```'
              # The table and the game's lines, without one line per try.
              grep -v '^try ' "report-$battle.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" -ne 0 ]; then
              echo "::error::$battle: blocked (or the playtest failed), exit $status"
              blocked=1
            fi
          done
          exit $blocked
