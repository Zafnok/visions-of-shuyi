name: Proptest explore

# The proptests with a random seed, on main (ticket 0150). Every PR and
# main run of CI uses one fixed seed (`PROPTEST_RNG_SEED` in ci.yml), so a
# red there is about the change; this run is where new cases are looked
# for, on every OS CI tests (a parser bug once showed only on macOS). A
# failing case opens a `proptest-seed` issue, or comments on the open one
# for that test, with the seed, the case and the line that reproduces it.

on:
  schedule:
    - cron: "0 5 * * *" # daily, 05:00 UTC
  workflow_dispatch:

concurrency:
  group: proptest-explore
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  explore:
    name: explore (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The game's content from the private repository (ADR-0117): the
      # tests read the real one, as CI's `test` job does.
      - uses: ./.github/actions/private-assets
        with:
          key: ${{ secrets.PRIVATE_ASSETS_KEY }}
          art: "false"
          content: "true"
          required: "true"
      - run: rustup show
      # No target/ in the cache (ticket 0171): a build here embeds the
      # private content (ADR-0117).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Restore only, except on main: a pull request's caches evicted
          # main's, past the 10 GB cap (ticket 0174).
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: false
          key: proptest-explore
      - name: Install macroquad system libraries
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      # 45 random bits, enough that no two runs share a seed.
      - name: Pick a random proptest seed
        run: |
          seed=$(( (RANDOM << 30) | (RANDOM << 15) | RANDOM ))
          echo "proptest seed $seed"
          echo "PROPTEST_RNG_SEED=$seed" >> "$GITHUB_ENV"
      # The crates with proptests. Every test binary runs (--no-fail-fast),
      # so one failure doesn't hide another.
      - name: Run the proptests
        id: tests
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast -p trpg-core -p trpg-content -p trpg-ui -p trpg-bots 2>&1 | tee tests.log
      # Only proptest's own lines go in the report, never the whole log:
      # the panic's test name and place, the reason, the minimal failing
      # input, and the regression lines proptest wrote. Each case at most
      # 60 lines.
      - name: Write the failing cases
        if: failure() && steps.tests.outcome == 'failure'
        env:
          OS: ${{ matrix.os }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p proptest-report
          awk '
            /^thread .* panicked at/ { test = $0; next }
            /^Test failed:/ { on = 1; n = 0; print "---"; print test }
            on && n < 60 { print; n++ }
            on && /^\tsuccesses:/ { on = 0 }
          ' tests.log > proptest-report/cases.txt
          if [ ! -s proptest-report/cases.txt ]; then
            echo "The tests failed, but no proptest case did: see the log."
            exit 0
          fi
          # The `cc` lines proptest added, to tracked files or new ones.
          git ls-files --others --exclude-standard -- '*proptest-regressions*' | while read -r f; do
            git add --intent-to-add -- "$f"
          done
          git diff -- '*proptest-regressions*' | grep -E '^(\+\+\+ |\+cc )' > proptest-report/regressions.txt || true
          {
            echo "seed=$PROPTEST_RNG_SEED"
            echo "os=$OS"
            echo "run=$RUN_URL"
          } > proptest-report/meta.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.tests.outcome == 'failure'
        with:
          name: proptest-explore-${{ matrix.os }}
          path: proptest-report
          if-no-files-found: ignore
          retention-days: 7

  # The one job that may write issues; it builds nothing and checks out
  # nothing.
  report:
    name: report
    needs: explore
    if: ${{ !cancelled() && needs.explore.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: proptest-explore-*
          path: reports
      - name: Open or update an issue per failing test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create proptest-seed --force --color FBCA04 \
            --description "A random proptest seed found a failing case on main (proptest-explore.yml)"
          shopt -s nullglob
          for dir in reports/*/; do
            [ -s "$dir/cases.txt" ] || continue
            seed=$(sed -n 's/^seed=//p' "$dir/meta.txt")
            os=$(sed -n 's/^os=//p' "$dir/meta.txt")
            run=$(sed -n 's/^run=//p' "$dir/meta.txt")
            # One issue per test: its name is the panic line's quoted part.
            grep -o "^thread '[^']*'" "$dir/cases.txt" | sed "s/^thread '//; s/'$//" | sort -u |
              while read -r test; do
                name=${test##*::}
                body=$(mktemp)
                {
                  echo "A random proptest seed fails \`$test\` on $os: $run"
                  echo
                  echo "Reproduce it with the seed (the test's crate, by its name):"
                  echo
                  echo '```'
                  echo "PROPTEST_RNG_SEED=$seed cargo test $name"
                  echo '```'
                  echo
                  echo "The case proptest found:"
                  echo
                  echo '```'
                  awk -v t="thread '$test'" '
                    /^---$/ { on = 0 }
                    index($0, t) == 1 { on = 1 }
                    on { print }
                  ' "$dir/cases.txt"
                  echo '```'
                  if [ -s "$dir/regressions.txt" ]; then
                    echo
                    echo "The regression lines proptest added (put them in those files with the fix, to keep the case):"
                    echo
                    echo '```'
                    cat "$dir/regressions.txt"
                    echo '```'
                  fi
                  echo
                  echo "A real bug: fix it with a ticket of its own (the \`write-ticket\` skill). PR runs keep their fixed seed (ci.yml), so this doesn't turn a PR red."
                } > "$body"
                title="Proptest: $test fails with a random seed"
                number=$(gh issue list --label proptest-seed --state open --search "\"$test\" in:title" \
                  --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
                if [ -n "$number" ]; then
                  gh issue comment "$number" --body-file "$body"
                else
                  gh issue create --label proptest-seed --title "$title" --body-file "$body"
                fi
              done
          done
