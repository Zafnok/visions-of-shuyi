name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 07:00 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    uses: ./.github/workflows/changes.yml

  analyze:
    name: analyze (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"

  # Single required check for this workflow. Matrix jobs skipped by `if:`
  # report one check with an unexpanded name, never the per-leg names, so
  # branch protection requires this job instead (ADR-0014).
  codeql-result:
    name: codeql-result
    if: always()
    needs: [changes, analyze]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read the pull request's head now (scripts/ci-result.sh).
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-result.sh
          sparse-checkout-cone-mode: false
      # A cancelled leg is red only on the commit still at the head: a run
      # a newer push cancelled passes with a notice (ticket 0150).
      - name: Fail if a needed job failed, or was cancelled on the head commit
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-result.sh
