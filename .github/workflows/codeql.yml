name: CodeQL

on:
  pull_request:
    # ready_for_review: a draft skips the heavy jobs, so marking it ready
    # starts the full run (ticket 0174).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 07:00 UTC

permissions:
  contents: read

concurrency:
  # A push to main is never cancelled: each push diffs only its own commits
  # (ticket 0174), so a cancelled run's change would go unchecked. Keyed by
  # the commit on push, as playtest.yml is (ticket 0515). A PR's newer commit
  # supersedes its older one.
  group: codeql-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  changes:
    name: changes
    uses: ./.github/workflows/changes.yml
    # By name, not `secrets: inherit` (zizmor's secrets-inherit): only for
    # comparing a pin move's trees (ticket 0174).
    secrets:
      PRIVATE_ASSETS_KEY: ${{ secrets.PRIVATE_ASSETS_KEY }}

  analyze:
    name: analyze (${{ matrix.language }})
    needs: changes
    # The actions analysis reads the workflows; a draft waits (ticket 0174).
    if: >-
      (needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # A change to the workflows alone analyzes only them (ticket 0174):
        # the Rust analysis took 7 of a workflow PR's 17 job-minutes.
        language: ${{ needs.changes.outputs.code == 'true' && fromJSON('["rust","actions"]') || fromJSON('["actions"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  # Single required check for this workflow. Matrix jobs skipped by `if:`
  # report one check with an unexpanded name, never the per-leg names, so
  # branch protection requires this job instead (ADR-0014).
  codeql-result:
    name: codeql-result
    if: always()
    needs: [changes, analyze]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read the pull request's head now (scripts/ci-result.sh).
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-result.sh
          sparse-checkout-cone-mode: false
      # A cancelled leg is red only on the commit still at the head: a run
      # a newer push cancelled passes with a notice (ticket 0150).
      - name: Fail if a needed job failed, or was cancelled on the head commit
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-result.sh
