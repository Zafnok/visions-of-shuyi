name: Pages

# The public web build at https://zafnok.github.io/visions-of-shuyi/, with the
# debug tools. It checks out nothing of the private repository (ticket 0158,
# then Nick's call on 2026-11-15): a Pages site of this repository is open to
# anyone and its files can be pulled out of the build, so it serves only the
# public files, the placeholder art and the test game. No content, no bought
# art, no voice clips. Nick's full build goes to a restricted itch.io page
# instead (playtest-itch.yml, which also checks the bought art), and the
# Chapter 1 demo to its own (demo.yml); the demo never goes here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # --debug-tools: Quick Battle on the title screen (ADR-0023).
      - run: cargo shuyi web --release --debug-tools
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/web

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
