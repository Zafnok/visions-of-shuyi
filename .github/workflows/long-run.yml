name: Long run

# The weekly long run (ticket 1355; engine ticket 3509, engine ADR-0146):
# the game's long scenario (`bench/act-loop.long.ron`) plays headless for
# about a million frames, twice, each in a process of its own, over the
# game's real content as the `bench` job reads it. A run fails when the
# live heap or the sounds alive grow past the scenario's slack after its
# warm-up, or when the second run hashes a sampled frame differently
# (docs/targets.md, *Long runs*). Never on a pull request: it takes too
# long. A failure opens one `long-run` issue, or comments on the open one.

on:
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 07:00 UTC
  workflow_dispatch:

concurrency:
  group: long-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  long-run:
    name: long run
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The game's content from the private repository (ADR-0117): the run
      # plays the real game, laid over assets/ by the build.
      - uses: ./.github/actions/private-assets
        with:
          key: ${{ secrets.PRIVATE_ASSETS_KEY }}
          art: "false"
          content: "true"
          required: "true"
      - run: rustup show
      - name: Install macroquad system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libx11-dev libxi-dev \
            libgl1-mesa-dev libudev-dev
      # No target/ in the cache (ticket 0171): a build here embeds the
      # private content (ADR-0117).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
          key: long-run
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - name: The long run, twice
        run: cargo shuyi bench --long --twice --out dist/bench
      - name: Post the table
        if: always()
        run: |
          table=dist/bench/long-report.md
          if [ -f "$table" ]; then cat "$table" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: long-report
          path: dist/bench/long-report.*
          retention-days: 30
      # The run's URL goes in through env, never into the script itself.
      - name: Open or update the long-run issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create long-run --force --color D93F0B \
            --description "The weekly long run found a leak or a run that differs (long-run.yml)"
          number=$(gh issue list --label long-run --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "The long run failed again: $RUN_URL"
          else
            gh issue create --label long-run \
              --title "Long run: a leak or a difference in the game's loop" \
              --body "The weekly long run failed: $RUN_URL

          Its report (the \`long-report\` artifact, and the run's summary) names the scenario, the heap or sound counts of the first and last quarters, the memory tags that grew most, or the frame where the second run differed. Fix it with a ticket of its own (the \`write-ticket\` skill), naming those tags (docs/targets.md, *Long runs*)."
          fi
