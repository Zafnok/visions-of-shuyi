name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: changes
    uses: ./.github/workflows/changes.yml

  fmt:
    name: fmt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The game's content from the private repository (ADR-0117): this
      # job reads the real one, laid over assets/ by the build.
      - uses: ./.github/actions/private-assets
        with:
          key: ${{ secrets.PRIVATE_ASSETS_KEY }}
          art: "false"
          content: "true"
          required: "true"
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install macroquad system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The game's content from the private repository (ADR-0117): this
      # job reads the real one, laid over assets/ by the build.
      - uses: ./.github/actions/private-assets
        with:
          key: ${{ secrets.PRIVATE_ASSETS_KEY }}
          art: "false"
          content: "true"
          required: "true"
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install macroquad system libraries
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - run: cargo test --workspace --locked

  # A docs-only PR that changes a Markdown file the code reads runs the
  # tests of the crates that read it, and nothing else (ADR-0098). A PR
  # with code runs the whole `test` job instead.
  doc-tests:
    name: doc-tests
    needs: changes
    if: needs.changes.outputs.code != 'true' && needs.changes.outputs.doc_crates != ''
    runs-on: ubuntu-latest
    env:
      DOC_CRATES: ${{ needs.changes.outputs.doc_crates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The game's content from the private repository (ADR-0117): this
      # job reads the real one, laid over assets/ by the build.
      - uses: ./.github/actions/private-assets
        with:
          key: ${{ secrets.PRIVATE_ASSETS_KEY }}
          art: "false"
          content: "true"
          required: "true"
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install macroquad system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - name: Test the crates that read the changed docs
        run: |
          args=()
          for krate in $DOC_CRATES; do args+=(-p "$krate"); done
          cargo test --locked "${args[@]}"

  wasm:
    name: wasm
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The game's content from the private repository (ADR-0117): this
      # job reads the real one, laid over assets/ by the build.
      - uses: ./.github/actions/private-assets
        with:
          key: ${{ secrets.PRIVATE_ASSETS_KEY }}
          art: "false"
          content: "true"
          required: "true"
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # No artifact of it: it embeds the private content, and a public
      # repository's artifacts can be downloaded by anyone (ADR-0117).
      - run: cargo shuyi web --release

  # the rules build without `std` for the Playdate (ADR-0070 §3); 1028
  # added `trpg-content`; 1029 adds `trpg-ui`. The engine's crates build
  # without it in their own repository's CI (ADR-0070 §6, ticket 1131),
  # and here as these crates' dependencies.
  no-std:
    name: no-std
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The game's content from the private repository (ADR-0117): this
      # job reads the real one, laid over assets/ by the build.
      - uses: ./.github/actions/private-assets
        with:
          key: ${{ secrets.PRIVATE_ASSETS_KEY }}
          art: "false"
          content: "true"
          required: "true"
      - run: rustup show
      - run: rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build -p trpg-core --no-default-features --target thumbv7em-none-eabihf --locked
      - run: cargo build -p trpg-content --no-default-features --target thumbv7em-none-eabihf --locked
      - run: cargo build -p trpg-ui --no-default-features --target thumbv7em-none-eabihf --locked

  # The Playdate front end's device build (ADR-0070 §1, ticket 1031):
  # `pdex.elf` linked and packed by the SDK's `pdc`. The Simulator's
  # `pdex.dll` is Windows-only and not built here. The SDK is downloaded
  # from Panic and cached by version, never committed: its license forbids
  # redistributing it.
  playdate:
    name: playdate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # About 4 minutes on main; a stalled apt mirror once held it for over
    # an hour (ticket 0132). Fail fast so the run can be re-run.
    timeout-minutes: 20
    env:
      # The one place the SDK's version is pinned.
      PLAYDATE_SDK_VERSION: 3.1.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The game's content from the private repository (ADR-0117): this
      # job reads the real one, laid over assets/ by the build.
      - uses: ./.github/actions/private-assets
        with:
          key: ${{ secrets.PRIVATE_ASSETS_KEY }}
          art: "false"
          content: "true"
          required: "true"
      - run: rustup show
      - run: rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the ARM compiler
        timeout-minutes: 8
        # No Recommends: they pull in the C++ standard library
        # (libstdc++-arm-none-eabi-newlib, 487 MB), and the device build
        # links only C (the shim, the SDK's C files) and newlib.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Point at the Playdate SDK
        run: echo "PLAYDATE_SDK_PATH=$HOME/playdate-sdk" >> "$GITHUB_ENV"
      - name: Cache the Playdate SDK
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/playdate-sdk
          key: playdate-sdk-${{ env.PLAYDATE_SDK_VERSION }}-linux
      - name: Download the Playdate SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$PLAYDATE_SDK_PATH"
          curl -fsSL "https://download.panic.com/playdate_sdk/Linux/PlaydateSDK-${PLAYDATE_SDK_VERSION}.tar.gz" \
            | tar -xz -C "$PLAYDATE_SDK_PATH" --strip-components=1
      - name: Clippy with the SDK glue
        run: cargo clippy -p trpg-playdate --features sdk --target thumbv7em-none-eabihf --locked -- -D warnings
      - name: Clippy with the bench build (1055)
        run: cargo clippy -p trpg-playdate --features sdk,bench --target thumbv7em-none-eabihf --locked -- -D warnings
      - name: Build the device game
        run: cargo xtask playdate --release --device
      - name: Check pdex.elf was linked and pdc packed the game
        run: |
          test -s target/playdate/Source/pdex.elf
          test -s target/playdate/VisionsOfShuyi.pdx/pdex.bin
          test -s target/playdate/VisionsOfShuyi.pdx/pdxinfo
          ls -l target/playdate/VisionsOfShuyi.pdx
      - name: Check pdc packed the converted sounds and music (1047)
        run: |
          test -s target/playdate/VisionsOfShuyi.pdx/audio/sfx/menu_move.pda
          test -s target/playdate/VisionsOfShuyi.pdx/music/new_sunrise_v1.pda

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The game's content from the private repository (ADR-0117): this
      # job reads the real one, laid over assets/ by the build.
      - uses: ./.github/actions/private-assets
        with:
          key: ${{ secrets.PRIVATE_ASSETS_KEY }}
          art: "false"
          content: "true"
          required: "true"
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install macroquad system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - run: cargo doc --workspace --no-deps --locked

  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The game's content from the private repository (ADR-0117): this
      # job reads the real one, laid over assets/ by the build.
      - uses: ./.github/actions/private-assets
        with:
          key: ${{ secrets.PRIVATE_ASSETS_KEY }}
          art: "false"
          content: "true"
          required: "true"
      - run: rustup show
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install macroquad system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --exclude trpg-app --lcov --output-path lcov.info
      - name: Generate Clippy report for SonarCloud
        run: cargo clippy --workspace --all-targets --message-format=json > clippy.json
        continue-on-error: true
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Ticket hygiene is cheap and tickets are docs, so this always runs (never
  # gated on `needs.changes`; ADR-0014) rather than being skipped on
  # docs-only PRs, which is exactly the case it needs to check.
  tickets:
    name: tickets
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
      EVENT_NAME: ${{ github.event_name }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      # Depth 2 for pr-size below: HEAD is the PR's merge commit, HEAD^1 the
      # base's tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # The game's content from the private repository (ADR-0117): this
      # job reads the real one, laid over assets/ by the build.
      - uses: ./.github/actions/private-assets
        with:
          key: ${{ secrets.PRIVATE_ASSETS_KEY }}
          art: "false"
          content: "true"
          required: "true"
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A warning on a PR past about 3,000 changed lines; never a failure,
      # and only the number on an engine-pin/ or sonar/ PR (ADR-0101).
      - name: Report the PR's size
        if: github.event_name == 'pull_request'
        run: cargo xtask pr-size --base HEAD^1 --branch "$HEAD_REF"
      - name: Check shared agent skill loaders
        shell: pwsh
        run: ./scripts/sync-agent-skills.ps1 -Check
      - name: Run ticket lint
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            cargo xtask ticket-lint --pr-branch "$HEAD_REF"
          else
            cargo xtask ticket-lint
          fi
      # No accidental mention of a GitHub user in the PR title: the release
      # notes are generated from it (ticket 0124).
      - name: Check the PR title for accidental mentions
        if: github.event_name == 'pull_request'
        run: cargo xtask check-mentions "$PR_TITLE"
      # No tracked file quotes a line of the scripts or a row of the maps,
      # read from the content checked out above (ADR-0118).
      - name: Check that no public file shows the content
        run: cargo xtask check-leaks
      # No key hard-coded in game code or player text (keyboard-input skill).
      - name: Check for hard-coded keys
        run: cargo shuyi check-keys
      # The engine's pinned commit is the same in shuyi-engine.rev,
      # Cargo.toml and Cargo.lock, and the lock isn't the local checkout's
      # (ADR-0063 §8, ticket 1131).
      - name: Check the engine's pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo xtask engine-pin --check
      # .claude/skills/shuyi-* is the pinned engine's skill pack (ADR-0097).
      - name: Check the engine's skill pack
        run: cargo xtask skill-pack --check
      # Every skill in .claude/skills keeps the engine's skill rules (ADR-0097).
      - name: Check the skills
        run: cargo shuyi check-skills .claude/skills
      # No new screen text written as a string literal (ADR-0045).
      - name: Check for screen text written as literals
        run: cargo shuyi check-text
      # The game fits every target shuyi.ron lists (ticket 0138).
      - name: Check the targets
        run: cargo shuyi check --target all
      # crates/app/src/app_info.rs is what shuyi.ron's `app` says (ticket 1199).
      - name: Check the game's identity
        run: cargo shuyi app-info --check
      # The rules crate's fence, with check-keys and check-text (ticket 0138).
      - name: Lint the game's shape
        run: cargo shuyi lint

  # The web package as release.yml exports it, without the bought art (the
  # gates never read it), for the bench job's package budget (ticket 1244).
  # Without the private content too (ADR-0117, ticket 0158): its package is
  # an artifact, which anyone can download from a public repository.
  # The package ships the crates' licenses report, made first as release.yml's
  # `licenses` job makes it.
  export:
    name: export
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: export
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-about
      - run: |
          mkdir -p dist/licenses
          cargo about generate -m crates/app/Cargo.toml about.hbs \
            -o dist/licenses/THIRD_PARTY_LICENSES.html
      # A release web export runs wasm-opt and fails without it (engine
      # ADR-0094, ticket 0916).
      - uses: ./.github/actions/binaryen
      # The export's own cargo commands don't take --locked.
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo shuyi export web --release --without private-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: export-web
          path: dist/export/web
          retention-days: 1

  # `cargo shuyi bench` (ticket 1244, engine ADR-0081): the scenarios in
  # bench/ played under Callgrind, each frame's instructions, the heap's peak
  # and the web package gated against the budgets of every target shuyi.ron
  # lists (docs/targets.md). The table is the job's summary; a number over its
  # budget fails the job, naming the scenario, the frame and the target.
  # Until ticket 1250, the numbers its first run found over budget that are
  # still over (KNOWN_OVER: ticket 1248) are warnings instead; any other
  # number over its budget, or a scenario that doesn't play, still fails it.
  # It isn't in `ci-result` until 1250 either.
  bench:
    name: bench
    needs: [changes, export]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The game's content from the private repository (ADR-0117): this
      # job reads the real one, laid over assets/ by the build.
      - uses: ./.github/actions/private-assets
        with:
          key: ${{ secrets.PRIVATE_ASSETS_KEY }}
          art: "false"
          content: "true"
          required: "true"
      - run: rustup show
      - name: Install macroquad system libraries and Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libx11-dev libxi-dev \
            libgl1-mesa-dev libudev-dev valgrind
          valgrind --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: bench
      - name: The web package the export job made
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: export-web
          path: dist/export/web
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Bench
        env:
          # target/what/scenario, or target/package, of each known finding.
          KNOWN_OVER: >-
            playdate/frame-instructions/battle-attack
            playdate/frame-instructions/battle-enemy-turn
            playdate/frame-instructions/dialogue-portrait
        run: |
          set +e
          cargo shuyi bench --out dist/bench 2>&1 | tee bench.log
          code=${PIPESTATUS[0]}
          set -e
          bash scripts/bench-known-over.sh "$code" bench.log dist/bench/bench-report.json
      - name: Post the table
        if: always()
        run: |
          table=dist/bench/bench-report.md
          if [ -f "$table" ]; then cat "$table" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-report
          path: dist/bench
          retention-days: 14

  # Single required check for this workflow. Matrix jobs skipped by `if:`
  # report one check with an unexpanded name, never the per-leg names, so
  # branch protection requires this job instead (ADR-0014).
  ci-result:
    name: ci-result
    if: always()
    # Not `bench` yet: its first run found numbers over their budgets, which
    # tickets 1247, 1248 and 1249 bring under (1248 still open); 1250 adds it here. Until
    # then it runs, posts its table and shows red without blocking.
    needs: [changes, fmt, clippy, test, doc-tests, wasm, no-std, playdate, docs, coverage, tickets, export]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::A required job failed or was cancelled."
            exit 1
          fi
