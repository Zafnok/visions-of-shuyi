name: Private assets
description: >-
  Checks out the private repository into assets-private/, at the effective
  pin, when the run has the key: the bought art (ADR-0040), the game's
  content (ADR-0117), or both. The effective pin is the commit named in
  assets-private.rev merged with each change's own pin file,
  assets-private.d/*.rev (ADR-0135). Run it after the repository's own
  checkout.

inputs:
  key:
    description: >-
      secrets.PRIVATE_ASSETS_KEY: the read-only deploy key of the private
      repository. Empty on forks. Dependabot's runs have a Dependabot secret
      of the same name.
    required: false
    default: ""
  required:
    description: >-
      'true' fails the job when the key is missing, instead of building with
      the public files.
    required: false
    default: "false"
  art:
    description: >-
      'true' checks out the bought art (game/, test/) and the voice clips
      (voice/, copied beside the game). Every gate leaves it out (ADR-0040
      §5).
    required: false
    default: "true"
  voice:
    description: >-
      With art 'true': 'false' leaves the voice clips out, for a build that
      ships none (the script preview, 0769); a web build ships voice/
      whenever it is there.
    required: false
    default: "true"
  content:
    description: >-
      'true' checks out the game's content (content/): the build lays it over
      assets/ whenever it is there, without a feature (ADR-0117). Every job
      that builds or loads content asks for it, with required 'true'. The
      story's documents (story/) come with it: no build reads them, but the
      tests of the names registry and the writer's guide do (0159).
    required: false
    default: "false"
  history:
    description: >-
      'true' fetches the whole history of every branch (commits and trees,
      no file contents), for `cargo xtask assets-pin --check`, which reads
      whether the pin only moved forward (ticket 0194). Pin files in
      assets-private.d/ fetch it too, whatever this says (ADR-0135).
    required: false
    default: "false"

outputs:
  pin:
    description: >-
      The effective pin: assets-private.rev's commit, then ' + ' and each pin
      file's commit when there are any (ADR-0135). For a trailer or a log.
    value: ${{ steps.resolve.outputs.pin }}
  features:
    description: >-
      'private-assets' when the art was checked out, otherwise empty. Pass it
      to cargo's --features.
    value: ${{ steps.plan.outputs.features }}
  web-flag:
    description: >-
      '--private-assets' when the art was checked out, otherwise empty. Pass
      it to cargo shuyi web.
    value: ${{ steps.plan.outputs.web-flag }}

  export-flag:
    description: >-
      Empty when the art was checked out, otherwise '--without private-assets'.
      Pass it to cargo shuyi export.
    value: ${{ steps.plan.outputs.export-flag }}

runs:
  using: composite
  steps:
    - name: Decide what this run checks out
      id: plan
      shell: bash
      env:
        HAS_KEY: ${{ inputs.key != '' }}
        REQUIRED: ${{ inputs.required }}
        ART: ${{ inputs.art }}
        VOICE: ${{ inputs.voice }}
        CONTENT: ${{ inputs.content }}
        HISTORY: ${{ inputs.history }}
      run: |
        set -euo pipefail
        if [ "$HAS_KEY" != "true" ]; then
          if [ "$REQUIRED" = "true" ]; then
            echo "::error::PRIVATE_ASSETS_KEY is missing: this job must build with the private repository's files (ADR-0040, ADR-0117)."
            exit 1
          fi
          echo "::warning::PRIVATE_ASSETS_KEY is not available to this run: building with the public files (ADR-0040)."
          echo "export-flag=--without private-assets" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        rev=$(tr -d '[:space:]' < assets-private.rev)
        folders=""
        if [ "$ART" = "true" ]; then
          # Only what the game embeds, the bought art of the test files (a
          # build with the debug tools embeds it too, ADR-0057) and the
          # voice clips that ship beside the game (ADR-0046); the bought
          # packs themselves stay behind.
          folders="game test"
          if [ "$VOICE" = "true" ]; then
            folders="$folders voice"
          fi
          {
            echo "features=private-assets"
            echo "web-flag=--private-assets"
          } >> "$GITHUB_OUTPUT"
        else
          echo "export-flag=--without private-assets" >> "$GITHUB_OUTPUT"
        fi
        if [ "$CONTENT" = "true" ]; then
          folders="$folders content story"
        fi
        if [ -z "$folders" ]; then
          echo "::error::Neither art nor content asked for: nothing to check out."
          exit 1
        fi
        # Each change's own pin file (ADR-0135): merging them needs the
        # history, which the checkout fetches without file contents.
        pins=""
        if [ -d assets-private.d ]; then
          pins=$(find assets-private.d -maxdepth 1 -name '*.rev' -type f | LC_ALL=C sort \
            | while read -r file; do tr -d '[:space:]' < "$file"; echo " "; done | tr -d '\n')
        fi
        history="$HISTORY"
        if [ -n "${pins// /}" ]; then
          history=true
        fi
        echo "Private repository: checking out $folders at $rev${pins:+ with the pins $pins}"
        {
          echo "rev=$rev"
          echo "pins=$pins"
          echo "history=$history"
          echo "folders<<EOF"
          echo "$folders" | tr ' ' '\n' | sed '/^$/d'
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - name: Check out the private repository
      if: steps.plan.outputs.rev != ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: Zafnok/visions-of-shuyi-assets
        ref: ${{ steps.plan.outputs.rev }}
        ssh-key: ${{ inputs.key }}
        path: assets-private
        sparse-checkout: ${{ steps.plan.outputs.folders }}
        fetch-depth: ${{ steps.plan.outputs.history == 'true' && '0' || '1' }}
        filter: ${{ steps.plan.outputs.history == 'true' && 'blob:none' || '' }}
        persist-credentials: false
    - name: Merge the pin files
      id: resolve
      if: steps.plan.outputs.rev != ''
      shell: bash
      env:
        KEY: ${{ inputs.key }}
        BASE: ${{ steps.plan.outputs.rev }}
        PINS: ${{ steps.plan.outputs.pins }}
      run: |
        set -euo pipefail
        if [ -z "${PINS// /}" ]; then
          echo "pin=$BASE" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The merge and the switch fetch the file contents they need, so git
        # gets the key for this step alone (the checkout keeps none). The
        # host keys come from GitHub's API, over HTTPS.
        key="$RUNNER_TEMP/private-assets-key"
        known="$RUNNER_TEMP/private-assets-known-hosts"
        if command -v cygpath > /dev/null; then
          # Windows runners: Git's ssh reads POSIX paths.
          key=$(cygpath -u "$key")
          known=$(cygpath -u "$known")
        fi
        trap 'rm -f "$key" "$known"' EXIT
        printf '%s\n' "$KEY" > "$key"
        chmod 600 "$key"
        curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$known"
        export GIT_SSH_COMMAND="ssh -i '$key' -o IdentitiesOnly=yes -o UserKnownHostsFile='$known' -o StrictHostKeyChecking=yes"
        # shellcheck disable=SC2086 # one word per pin
        effective=$(bash "$GITHUB_ACTION_PATH/resolve.sh" assets-private "$BASE" $PINS)
        echo "Effective pin: $effective"
        shown="$BASE"
        for pin in $PINS; do shown="$shown + $pin"; done
        echo "pin=$shown" >> "$GITHUB_OUTPUT"
    - name: Check the content is there
      if: steps.plan.outputs.rev != '' && inputs.content == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # A pin from before the content layer has no content/: the build
        # would quietly read the public files.
        if [ ! -d assets-private/content ]; then
          echo "::error::assets-private.rev names a commit without content/ (ADR-0117)."
          exit 1
        fi
        echo "Content: $(find assets-private/content -type f | wc -l) files"
    - name: Put the voice clips beside the game
      if: steps.plan.outputs.rev != '' && inputs.art == 'true' && inputs.voice == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Not embedded (ADR-0046): the game and the packaging read voice/.
        if [ -d assets-private/voice ]; then
          rm -rf voice
          cp -r assets-private/voice voice
        fi
