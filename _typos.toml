[default.extend-words]
# vim-style keys mentioned throughout design/UI docs.
hjkl = "hjkl"
# Project/tool names typos misreads as misspellings of other words.
ratatui = "ratatui"
# Rin, a name offered for the tutorial guide (ticket 0731), quoted by Nick.
rin = "rin"
# Fragments from hyphenated/compound tokens split across lines or by
# typos's identifier splitting (e.g. "CC-BY-ND", "mis-keys", "PNGs").
nd = "nd"
mis = "mis"
pn = "pn"
# Verbatim quote of Nick's spoken words in docs/design/magic.md; preserved
# as said, not a real typo to fix.
beginnning = "beginnning"
# Verbatim quote of Nick in docs/design/title-screen.md (ticket 0032).
whcih = "whcih"
# Verbatim quote of Nick asking for the title's intro cinematic (ticket
# 0036 and the tickets that quote it).
reminiscient = "reminiscient"
conversaiton = "conversaiton"
# Verbatim quote of Nick on key hints (Chapter 1 playtest round 3, tickets
# 0804 and 0250).
discernable = "discernable"
# Two-letter runs of colour keys in snapshot colour grids (ADR-0007),
# e.g. `Iy` in the portrait snapshots, `abd` in the dialogue ones.
iy = "iy"
abd = "abd"
# Names in the dialogue research (assets-private/story/craft.md, ticket 0736):
# Mass Effect's Commander Shepard, the CoSER paper (split as "Co"+"SER"), and
# Hask, the made-up deserter captain of the story-writing skill's examples.
shepard = "shepard"
ser = "ser"
hask = "hask"
# Invented story names and words (assets-private/story/names.md, ticket 0701).
aske = "aske"
othe = "othe"
mor = "mor"
# Ned Tolley, the Chapter 3 boss (assets-private/story/names.md, ticket 0743).
ned = "ned"

[default]
# Commit hashes (e.g. the engine pin c1ba9ec8 in docs/engine/pins.md):
# typos splits them into fragments like "ba". A hex run is skipped only when
# it holds a digit, so a hex-only word like "deadbeef" is still read. Never
# allow a hash fragment as a word (ticket 0149). Typos's regex has no
# look-ahead, so the 7-40 length can't be required too; a short hex run with
# a digit is never a word anyway.
extend-ignore-re = ['\b[0-9a-f]*[0-9][0-9a-f]*\b']

[files]
# Vendored third-party font data (hex bitmaps, codepoint names) and the atlas
# generated from it: not our prose, and never edited by hand.
extend-exclude = [
    "assets-src/fonts/*.bdf",
    "assets/fonts/atlas.ron",
    "assets/fonts/Terminus-LICENSE.txt",
    # Creative Commons' legal text, verbatim (ticket 0809): its own
    # spelling ("MERCHANTIBILITY") stays.
    "assets/audio/licenses/CC-BY-3.0.txt",
    # The ticket about the hash fragment "ba" names the word itself.
    "tickets/*/0149-typos-ignores-commit-hashes-by-pattern-not-by-allowing-ba-everywhere.md",
]
